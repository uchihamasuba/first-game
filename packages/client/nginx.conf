server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Fallback routing for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxying (if the client expects to call /api on the same domain)
    # We can handle this here or rely on the client knowing the backend URL.
    # Since Vite was proxying /api to 3000, we should do the same in production.
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
