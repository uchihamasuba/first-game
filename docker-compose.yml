version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - packages/server/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/leaderboard || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
